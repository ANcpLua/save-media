name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stores:
        description: Which stores to publish to
        type: choice
        default: all
        options: [all, edge, chrome, firefox]
      chrome:
        description: "Chrome: release (upload and submit) or update (upload only, submit by hand after the privacy form)"
        type: choice
        default: release
        options: [release, update]
      edge:
        description: "Edge: release (upload and publish) or update (upload only, publish by hand after listing and privacy)"
        type: choice
        default: release
        options: [release, update]

permissions:
  contents: write

jobs:
  release:
    name: Publish to Chrome, Edge, and Firefox stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Bun installs and runs everything. --bun keeps tools whose launcher names node off the runner's own Node.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Every version field in store.config.json's versionFiles must agree,
      # and on a tag push the tag must agree with them.
      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION=$(bunx --bun store-publish version --tag "$GITHUB_REF_NAME")
          else
            VERSION=$(bunx --bun store-publish version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=v$VERSION automated release" >> "$GITHUB_OUTPUT"

      # The listing text and the README store table are release artifacts too:
      # a forbidden word or a stale id must stop the release before any upload.
      - run: bunx --bun store-publish lint
      - run: bunx --bun store-publish readme --check

      - run: bun run --filter @savemedia/core build
      - name: Build and pack all targets
        run: bun run --filter @savemedia/extension zip

      # A tag builds the GitHub release only. Store uploads are an explicit
      # dispatch, per store, so a version is never uploaded twice and Chrome
      # and Edge can be uploaded without submitting.
      - name: Publish to Edge Add-ons
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","edge"]'), inputs.stores) }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: bunx --bun store-publish edge ${{ inputs.edge || 'release' }} --notes "${{ steps.v.outputs.notes }}"

      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","chrome"]'), inputs.stores) }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: bunx --bun store-publish chrome ${{ inputs.chrome || 'release' }}

      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","firefox"]'), inputs.stores) }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx --bun store-publish firefox release --notes "${{ steps.v.outputs.notes }}" --source

      - name: Create GitHub release with store zips
        if: ${{ !cancelled() && github.ref_type == 'tag' }}
        working-directory: packages/extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            savemedia-chrome-*.zip savemedia-edge-*.zip savemedia-firefox-*.zip savemedia-source-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
