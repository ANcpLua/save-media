name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stores:
        description: Which stores to publish to
        type: choice
        default: all
        options: [all, edge, chrome, firefox]

permissions:
  contents: write

jobs:
  release:
    name: Publish to Chrome, Edge, and Firefox stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: v
        run: |
          PKG=$(node -p "require('./packages/extension/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match packages/extension/manifest.json version $PKG"
              exit 1
            fi
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "notes=v$PKG automated release" >> "$GITHUB_OUTPUT"

      # The listing text and the README store table are release artifacts too:
      # a forbidden word or a stale id must stop the release before any upload.
      - run: pnpm exec store-publish lint
      - run: pnpm exec store-publish readme --check

      - run: pnpm --filter @savemedia/core build
      - name: Build and pack all targets
        run: pnpm --filter @savemedia/extension zip

      - name: Publish to Edge Add-ons
        if: ${{ contains(fromJSON('["all","edge"]'), inputs.stores || 'all') }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: pnpm exec store-publish edge release --notes "${{ steps.v.outputs.notes }}"

      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && contains(fromJSON('["all","chrome"]'), inputs.stores || 'all') }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: pnpm exec store-publish chrome release

      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && contains(fromJSON('["all","firefox"]'), inputs.stores || 'all') }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm exec store-publish firefox release --notes "${{ steps.v.outputs.notes }}" --source

      - name: Create GitHub release with store zips
        if: ${{ !cancelled() && github.ref_type == 'tag' }}
        working-directory: packages/extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            savemedia-chrome-*.zip savemedia-edge-*.zip savemedia-firefox-*.zip savemedia-source-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
