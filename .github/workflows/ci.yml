name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-typescript:
    name: Unit (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # bun installs the workspace; Node still runs Vite, Vitest and Playwright.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # @savemedia/core's dist/ is gitignored. The extension imports its
      # .d.ts at typecheck time, so core must be built first.
      - run: bun run --filter @savemedia/core build
      - run: bun run --filter './packages/*' typecheck
      - run: bun run --filter './packages/*' test
      # Store text and the README table are checked like code.
      - run: bunx store-publish lint
      - run: bunx store-publish readme --check

  build-extension:
    name: Build extension (${{ matrix.target }})
    needs: unit-typescript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # bun installs the workspace; Node still runs Vite, Vitest and Playwright.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @savemedia/core build
      - run: bun run --filter @savemedia/extension build:${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: savemedia-${{ matrix.target }}
          path: packages/extension/dist-${{ matrix.target }}/
          if-no-files-found: error

  e2e:
    name: E2E (Playwright ${{ matrix.project }})
    needs: build-extension
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: firefox
            project: firefox-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # bun installs the workspace; Node still runs Vite, Vitest and Playwright.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --filter @savemedia/core build
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/extension
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun run --filter @savemedia/extension build:chrome
      # Loading the unpacked MV3 extension via --load-extension requires
      # `headless: false`, which on Linux CI needs an X display. xvfb is
      # pre-installed on ubuntu-latest; the -a flag picks a free DISPLAY.
      - run: xvfb-run -a bunx playwright test --project=${{ matrix.project }}
        working-directory: packages/extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: packages/extension/playwright-report/
