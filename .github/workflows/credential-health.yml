name: Credential health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths: ['.github/workflows/credential-health.yml']
permissions:
  contents: read
concurrency:
  group: credential-health
  cancel-in-progress: false
jobs:
  chrome:
    name: chrome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ANcpLua/vitals
          ref: e5e69cf086b93ef511cb501fcc9d013e6d3f347c
          path: .vitals
          sparse-checkout: Sources/VitalsKernel/credential_health.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          sparse-checkout: store.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Probe credentials
        id: probe
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: python3 .vitals/Sources/VitalsKernel/credential_health.py --probe chrome --config source/store.config.json
      - name: Credential accepted
        if: steps.probe.outputs.state == 'valid'
        run: echo "Read-only authentication passed"
      - name: Credential rejected
        if: steps.probe.outputs.state == 'invalid'
        run: exit 1
      - name: Credential scope mismatch
        if: steps.probe.outputs.state == 'scopeMismatch'
        run: exit 1
      - name: Credential absent
        if: steps.probe.outputs.state == 'missing'
        run: exit 1
      - name: Check not configured
        if: steps.probe.outputs.state == 'unchecked'
        run: exit 1
      - name: Provider unavailable
        if: steps.probe.outputs.state == 'unavailable'
        run: exit 1
  amo:
    name: amo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ANcpLua/vitals
          ref: e5e69cf086b93ef511cb501fcc9d013e6d3f347c
          path: .vitals
          sparse-checkout: Sources/VitalsKernel/credential_health.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          sparse-checkout: store.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Probe credentials
        id: probe
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python3 .vitals/Sources/VitalsKernel/credential_health.py --probe amo --config source/store.config.json
      - name: Credential accepted
        if: steps.probe.outputs.state == 'valid'
        run: echo "Read-only authentication passed"
      - name: Credential rejected
        if: steps.probe.outputs.state == 'invalid'
        run: exit 1
      - name: Credential scope mismatch
        if: steps.probe.outputs.state == 'scopeMismatch'
        run: exit 1
      - name: Credential absent
        if: steps.probe.outputs.state == 'missing'
        run: exit 1
      - name: Check not configured
        if: steps.probe.outputs.state == 'unchecked'
        run: exit 1
      - name: Provider unavailable
        if: steps.probe.outputs.state == 'unavailable'
        run: exit 1
  edge:
    name: edge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ANcpLua/vitals
          ref: e5e69cf086b93ef511cb501fcc9d013e6d3f347c
          path: .vitals
          sparse-checkout: Sources/VitalsKernel/credential_health.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          sparse-checkout: store.config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Probe credentials
        id: probe
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_OPERATION_ID: "899b2074-4ad5-496f-861a-b08b7b3e54f4"
        run: python3 .vitals/Sources/VitalsKernel/credential_health.py --probe edge --config source/store.config.json
      - name: Credential accepted
        if: steps.probe.outputs.state == 'valid'
        run: echo "Read-only authentication passed"
      - name: Credential rejected
        if: steps.probe.outputs.state == 'invalid'
        run: exit 1
      - name: Credential scope mismatch
        if: steps.probe.outputs.state == 'scopeMismatch'
        run: exit 1
      - name: Credential absent
        if: steps.probe.outputs.state == 'missing'
        run: exit 1
      - name: Check not configured
        if: steps.probe.outputs.state == 'unchecked'
        run: exit 1
      - name: Provider unavailable
        if: steps.probe.outputs.state == 'unavailable'
        run: exit 1
