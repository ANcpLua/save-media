name: store-status

on:
  workflow_dispatch:
    inputs:
      store:
        description: What to query. Everything is read-only except amo-listing-apply, which writes the AMO description from the repo.
        type: choice
        default: chrome
        options: [status, chrome, edge, firefox, amo-listing-diff, amo-listing-apply, amo-icon-diff, amo-icon-apply, amo-previews-list, amo-previews-apply]

permissions: {}

jobs:
  status:
    name: Store status (${{ inputs.store }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # bun installs the workspace; Node still runs Vite, Vitest and Playwright.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      # One table for all three stores: live version from the public listings,
      # review state and credential check through the APIs.
      - name: All stores (markdown table)
        if: ${{ inputs.store == 'status' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish status --markdown | tee "$GITHUB_STEP_SUMMARY"

      - name: Chrome Web Store status
        if: ${{ inputs.store == 'chrome' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: bunx store-publish chrome status

      - name: Edge credential probe and key expiry
        if: ${{ inputs.store == 'edge' }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: bunx store-publish edge status

      - name: Firefox Add-ons status
        if: ${{ inputs.store == 'firefox' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish firefox status

      - name: AMO listing diff
        if: ${{ inputs.store == 'amo-listing-diff' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish amo-listing diff

      - name: AMO icon (read-only)
        if: ${{ inputs.store == 'amo-icon-diff' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish firefox icon --diff

      - name: AMO icon apply
        if: ${{ inputs.store == 'amo-icon-apply' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish lint && bunx store-publish firefox icon

      - name: AMO previews (read-only)
        if: ${{ inputs.store == 'amo-previews-list' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish firefox previews list

      - name: AMO previews apply
        if: ${{ inputs.store == 'amo-previews-apply' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish lint && bunx store-publish firefox previews set

      - name: AMO listing apply
        if: ${{ inputs.store == 'amo-listing-apply' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx store-publish lint && bunx store-publish amo-listing apply
