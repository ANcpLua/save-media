# Weekly dependency updates. "minor-and-patch" PRs are merged automatically
# once ci is green (dependabot-auto-merge.yml); "major" PRs wait for a person.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
